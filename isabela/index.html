
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>isabela | Construgarden View</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--panel:rgba(22,28,36,.82);--ink:#EEF2F6;--muted:#A9B4C0;--accent:#6E95FF;--line:rgba(255,255,255,.14)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
#app{position:fixed;inset:0}
#app canvas{display:block;width:100%;height:100%;touch-action:none}
.top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;pointer-events:none;background:linear-gradient(rgba(0,0,0,.45),transparent)}
.top .brand{margin:2px 0 0;font-size:12px;font-weight:700;color:var(--muted);text-shadow:0 1px 3px rgba(0,0,0,.5)}
.top h1{margin:0;font-size:18px;font-weight:800;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;gap:6px;padding:6px;border-radius:12px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.bar button{font:inherit;font-size:13px;font-weight:700;color:var(--ink);background:transparent;border:0;border-radius:8px;padding:9px 12px;cursor:pointer;white-space:nowrap}
.bar button:hover{background:rgba(255,255,255,.1)}
.bar button[aria-pressed="true"]{background:var(--accent);color:#0E1420}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pop{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 70px);min-width:240px;max-width:calc(100% - 24px);max-height:50vh;overflow:auto;padding:12px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:14px}
.pop[hidden]{display:none}
.pop label{display:flex;gap:10px;align-items:center;padding:6px 0;cursor:pointer}
.pop input{width:18px;height:18px;accent-color:var(--accent)}
.pop i{width:10px;height:10px;border-radius:2px;display:inline-block;background:var(--accent)}
#loading{position:fixed;inset:0;display:grid;place-items:center;text-align:center;background:inherit;z-index:5}
#loading .lbrand{display:block;margin-top:18px;font-weight:800;font-size:15px;color:var(--ink)}
#loading p{margin:14px 0 0;color:var(--muted);font-size:14px}
.spin{width:40px;height:40px;border-radius:50%;border:4px solid rgba(255,255,255,.2);border-top-color:var(--accent);margin:auto;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.help{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 74px);font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--line);padding:8px 12px;border-radius:10px;text-align:center;max-width:calc(100% - 24px);transition:opacity .6s}
.help.off{opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){.spin{animation:none}.help{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<div class="top"><h1 id="title"></h1><p class="brand">Construgarden View</p></div>
<div id="loading"><div><div class="spin"></div><p id="ltext">Carregando modelo 3D…</p><span class="lbrand">Construgarden View</span></div></div>
<div class="help" id="help">Arraste para girar. Use o scroll ou dois dedos para aproximar. Botão direito, scroll apertado ou dois dedos movem a vista.</div>
<div class="pop" id="discPop" hidden></div>
<div class="bar">
  <button type="button" id="bFit">Enquadrar</button>
  <button type="button" id="bRot" aria-pressed="false">Girar sozinho</button>
  <button type="button" id="bDisc" hidden>Disciplinas</button>
  <button type="button" id="bFull">Tela cheia</button>
</div>

<script>
(function(){
'use strict';
const CFG = {"title":"isabela","background":"#d9dde2","light":{"exposure":1,"ambient":1,"sun":1.5,"shadow":0.85,"az":35,"el":55,"color":"#fff4e6","groundOffset":0,"shadowsOn":true,"groundY":5.45},"shadows":true,"autoRotate":false,"gzip":true,"colors":{"isabela":"#D9822B"},"camera":{"pos":[24.43135753171835,18.480540847103054,22.13455369092396],"target":[2.2446337526737237,2.512425831646784,-0.41960212134400543],"fov":45}};
const $ = id => document.getElementById(id);
$('title').textContent = CFG.title || '';
document.body.style.background = CFG.background;
$('loading').style.background = CFG.background;
if (typeof THREE === 'undefined' || !THREE.GLTFLoader){ $('ltext').textContent = 'Não foi possível carregar o visualizador. Verifique a conexão com a internet e recarregue a página.'; return; }

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
$('app').appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(CFG.background).convertSRGBToLinear();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new THREE.RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(CFG.camera ? CFG.camera.fov : 45, 1, 0.05, 5000);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.screenSpacePanning = true;
controls.mouseButtons = {LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.PAN, RIGHT: THREE.MOUSE.PAN};
controls.autoRotateSpeed = 0.8;
renderer.domElement.addEventListener('mousedown', e=>{ if (e.button === 1) e.preventDefault(); });

const hemi = new THREE.HemisphereLight(0xe8f2ff, 0x6b5a45, 0.35); scene.add(hemi);
const L = Object.assign({exposure:1, ambient:1, sun:1.5, shadow:0.85, az:35, el:55, color:'#fff4e6'}, CFG.light || {});
const useShadows = !!CFG.shadows && L.shadowsOn !== false;
renderer.shadowMap.enabled = useShadows;
renderer.toneMappingExposure = L.exposure;
hemi.intensity = 0.35*L.ambient;
const sunCol = new THREE.Color(L.color).convertSRGBToLinear();
const sh = useShadows ? L.shadow : 0;
const sun = new THREE.DirectionalLight(sunCol, L.sun*sh);
sun.castShadow = useShadows; sun.shadow.mapSize.set(4096,4096); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
scene.add(sun); scene.add(sun.target);
const sunFill = new THREE.DirectionalLight(sunCol, L.sun*(1-sh)); sunFill.target = sun.target; scene.add(sunFill);
const catcher = new THREE.Mesh(new THREE.PlaneGeometry(1,1), new THREE.ShadowMaterial({opacity:0.32*L.shadow}));
catcher.rotation.x = -Math.PI/2; catcher.receiveShadow = true; catcher.visible = useShadows; scene.add(catcher);
function sunDir(){ const az = L.az*Math.PI/180, el = L.el*Math.PI/180; return new THREE.Vector3(Math.cos(el)*Math.sin(az), Math.sin(el), Math.cos(el)*Math.cos(az)); }

function resize(){ renderer.setSize(window.innerWidth, window.innerHeight, false); camera.aspect = window.innerWidth/Math.max(window.innerHeight,1); camera.updateProjectionMatrix(); }
window.addEventListener('resize', resize); resize();

let model = null, mixer = null, homePos = null, homeTarget = null;
const clock = new THREE.Clock();
renderer.setAnimationLoop(()=>{ const dt = clock.getDelta(); if (mixer) mixer.update(dt); controls.update(); renderer.render(scene, camera); });

function bbox(){
  const b = new THREE.Box3(); if (!model) return b;
  model.updateMatrixWorld(true);   // garante a posição real de cada disciplina antes de medir
  model.traverse(o=>{ if (o.isMesh && isShown(o)) b.expandByObject(o); });
  return b;
}
function isShown(o){ for (let x=o; x; x=x.parent) if (!x.visible) return false; return true; }
function fitSun(){
  const b = bbox(); if (b.isEmpty()) return;
  const c = b.getCenter(new THREE.Vector3()), s = b.getSize(new THREE.Vector3()).length();
  sun.position.copy(c).add(sunDir().multiplyScalar(s));
  sunFill.position.copy(sun.position);
  sun.target.position.copy(c);
  const cam = sun.shadow.camera; cam.left = cam.bottom = -s*0.6; cam.right = cam.top = s*0.6; cam.near = s*0.01; cam.far = s*2.2; cam.updateProjectionMatrix();
  const gy = (typeof L.groundY === 'number' ? L.groundY : b.min.y) + (L.groundOffset || 0) - s*0.0005;
  catcher.position.set(c.x, gy, c.z); catcher.scale.set(s*3, s*3, 1);
}
function fit(){
  const b = bbox(); if (b.isEmpty()) return;
  const s = b.getSize(new THREE.Vector3()).length(), c = b.getCenter(new THREE.Vector3());
  controls.target.copy(c);
  camera.position.copy(c).add(new THREE.Vector3(.6,.45,.8).normalize().multiplyScalar(s*1.05));
  camera.near = s/1000; camera.far = s*100; camera.updateProjectionMatrix();
}
function home(){
  if (homePos){ camera.position.copy(homePos); controls.target.copy(homeTarget); controls.update(); }
  else fit();
}
$('bFit').onclick = home;
$('bRot').onclick = ()=>{ controls.autoRotate = !controls.autoRotate; $('bRot').setAttribute('aria-pressed', controls.autoRotate); };
$('bFull').onclick = ()=>{
  const d = document, el = d.documentElement;
  if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
  else { const f = el.requestFullscreen || el.webkitRequestFullscreen; if (f){ const r = f.call(el); if (r && r.catch) r.catch(()=>{}); } }
};
if (!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen)) $('bFull').hidden = true;
$('bDisc').onclick = ()=>{ $('discPop').hidden = !$('discPop').hidden; };
renderer.domElement.addEventListener('pointerdown', ()=>{ $('help').classList.add('off'); $('discPop').hidden = true; });
setTimeout(()=>$('help').classList.add('off'), 7000);

function setupMaterials(root){
  root.traverse(o=>{
    if (!o.isMesh) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    let opaque = true;
    mats.forEach(m=>{
      if ('envMapIntensity' in m) m.envMapIntensity = L.ambient*(m.userData.reflect ?? 1);
      if (m.transparent){
        m.depthWrite = m.opacity > 0.9;
        m.side = THREE.FrontSide;
        if (m.opacity < 0.6) opaque = false;
      }
    });
    o.castShadow = useShadows && opaque;
    o.receiveShadow = useShadows;
  });
}

function decode(){
  const b64 = $('glb').textContent.trim();
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return CFG.gzip ? fflate.gunzipSync(bytes) : bytes;
}

setTimeout(()=>{
  let bytes;
  try { bytes = decode(); }
  catch(e){ console.error(e); $('ltext').textContent = 'O arquivo do modelo está corrompido.'; return; }
  new THREE.GLTFLoader().parse(bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength), '', gltf=>{
    model = gltf.scene;
    setupMaterials(model);
    scene.add(model);
    if (gltf.animations && gltf.animations.length){ mixer = new THREE.AnimationMixer(model); gltf.animations.forEach(a=>mixer.clipAction(a).play()); }
    if (CFG.camera){
      homePos = new THREE.Vector3().fromArray(CFG.camera.pos);
      homeTarget = new THREE.Vector3().fromArray(CFG.camera.target);
      const s = bbox().getSize(new THREE.Vector3()).length() || 10;
      camera.near = s/1000; camera.far = s*100; camera.updateProjectionMatrix();
      home();
    } else fit();
    fitSun();
    controls.autoRotate = !!CFG.autoRotate; $('bRot').setAttribute('aria-pressed', controls.autoRotate);
    // disciplinas: filhos do nó principal
    const root = model.children.length === 1 ? model.children[0] : model;
    const groups = root.children.filter(c=>c.name);
    if (groups.length > 1){
      $('bDisc').hidden = false;
      groups.forEach((g,i)=>{
        const lab = document.createElement('label');
        const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = true;
        const sw = document.createElement('i'); sw.style.background = (CFG.colors && CFG.colors[g.name]) || '#6E95FF';
        const sp = document.createElement('span'); sp.textContent = g.name;
        cb.onchange = ()=>{ g.visible = cb.checked; fitSun(); };
        lab.append(cb, sw, sp); $('discPop').appendChild(lab);
      });
    }
    $('loading').remove();
  }, err=>{ console.error(err); $('ltext').textContent = 'Não foi possível abrir o modelo.'; });
}, 30);
})();
</script>
